<!-- ==========================================
     ISM - Islamic School Management
     Multilingual Master Platform Header
========================================== -->


<header class="erp-header">


    <!-- ======================================
         Left Section
    ======================================= -->

    <div class="header-left">


        <button
            id="menuToggle"
            type="button"
            aria-label="Open Menu"
            data-i18n-title="menu">

            ☰

        </button>



        <div class="platform-brand">


            <img
                id="platformLogo"
                src=""
                alt="ISM"
                class="platform-logo">


            <div class="brand-text">


                <h3 id="platformName">
                    ISM
                </h3>


                <small id="platformFullName">
                    Islamic School Management
                </small>


            </div>


        </div>


    </div>





    <!-- ======================================
         Right Section
    ======================================= -->

    <div class="header-right">


        <!-- ==================================
             Language Selector
        =================================== -->

        <div class="language-control">


            <span
                class="language-icon"
                aria-hidden="true">

                🌐

            </span>


            <select
                id="languageSelector"
                aria-label="Language">


                <option value="bn">
                    বাংলা
                </option>


                <option value="en">
                    English
                </option>


                <option value="ar">
                    العربية
                </option>


            </select>


        </div>





        <!-- ==================================
             Institution
        =================================== -->

        <div class="institution-display">


            <small
                data-i18n="institution">

                Institution

            </small>


            <strong
                id="institutionName">

                -

            </strong>


        </div>





        <!-- ==================================
             Notifications
        =================================== -->

        <button
            type="button"
            id="notificationBtn"
            class="notification-btn"
            aria-label="Notifications"
            data-i18n-title="notifications">

            🔔

        </button>





        <!-- ==================================
             Current User
        =================================== -->

        <div class="profile">


            <span
                id="userName">

                Admin

            </span>


            <small
                id="userRole">

                Administrator

            </small>


        </div>





        <!-- ==================================
             Logout
        =================================== -->

        <button
            type="button"
            id="logoutBtn"
            class="logout-btn">


            🚪

            <span
                data-i18n="logout">

                Logout

            </span>


        </button>


    </div>


</header>





<script>

/* ==========================================
   ISM Header Controller
========================================== */

(function () {

    "use strict";


    // ======================================
    // Platform Identity
    // ======================================

    function loadPlatform() {

        if (
            !window.APP_CONFIG ||
            !APP_CONFIG.platform
        ) {

            return;

        }


        const platformName =
            document.getElementById(
                "platformName"
            );


        const platformFullName =
            document.getElementById(
                "platformFullName"
            );


        if (platformName) {

            platformName.textContent =
                APP_CONFIG
                    .platform
                    .name
                    ||
                    "ISM";

        }


        if (platformFullName) {

            platformFullName.textContent =
                APP_CONFIG
                    .platform
                    .fullName
                    ||
                    "Islamic School Management";

        }

    }





    // ======================================
    // Platform Logo
    // ======================================

    function loadPlatformLogo() {

        const logo =
            document.getElementById(
                "platformLogo"
            );


        if (
            !logo ||
            !window.APP_CONFIG ||
            !APP_CONFIG.branding
        ) {

            return;

        }


        const logoPath =
            APP_CONFIG
                .branding
                .logo;


        if (!logoPath) {

            return;

        }


        /*
         * components/header.html
         * থেকে root assets-এ যাওয়ার path.
         */

        logo.src =
            "../" + logoPath;

    }





    // ======================================
    // Institution
    // ======================================

    function loadInstitution() {

        if (
            typeof window.getInstitution !==
            "function"
        ) {

            return;

        }


        const institution =
            window.getInstitution();


        const institutionName =
            document.getElementById(
                "institutionName"
            );


        if (
            institutionName &&
            institution
        ) {

            institutionName.textContent =
                institution.name
                ||
                "-";

        }

    }





    // ======================================
    // Current User
    // ======================================

    function loadCurrentUser() {

        let user = null;


        if (
            typeof window.getCurrentUser ===
            "function"
        ) {

            user =
                window.getCurrentUser();

        }


        if (!user) {

            return;

        }


        const userName =
            document.getElementById(
                "userName"
            );


        const userRole =
            document.getElementById(
                "userRole"
            );


        if (userName) {

            userName.textContent =
                user.name
                ||
                user.username
                ||
                "User";

        }


        if (userRole) {

            userRole.textContent =
                user.role
                ||
                "User";

        }

    }





    // ======================================
    // Language
    // ======================================

    function setupLanguageSelector() {

        const selector =
            document.getElementById(
                "languageSelector"
            );


        if (!selector) {

            return;

        }


        if (
            typeof window.getCurrentLanguage ===
            "function"
        ) {

            selector.value =
                window.getCurrentLanguage();

        }


        selector.addEventListener(
            "change",
            function () {

                const language =
                    selector.value;


                if (
                    typeof window.changeLanguage ===
                    "function"
                ) {

                    window.changeLanguage(
                        language
                    );

                }

            }
        );

    }





    // ======================================
    // Language-ready refresh
    // ======================================

    document.addEventListener(
        "ismLanguageReady",
        function () {

            if (
                typeof window.translatePage ===
                "function"
            ) {

                window.translatePage();

            }

        }
    );


    document.addEventListener(
        "ismLanguageChanged",
        function () {

            if (
                typeof window.translatePage ===
                "function"
            ) {

                window.translatePage();

            }

        }
    );





    // ======================================
    // Logout
    // ======================================

    function setupLogout() {

        const logoutBtn =
            document.getElementById(
                "logoutBtn"
            );


        if (!logoutBtn) {

            return;

        }


        logoutBtn.addEventListener(
            "click",
            function () {

                if (
                    typeof window.logout ===
                    "function"
                ) {

                    window.logout();

                    return;

                }


                localStorage.removeItem(
                    "ERP_SESSION"
                );


                localStorage.removeItem(
                    "currentUser"
                );


                window.location.href =
                    "../index.html";

            }
        );

    }





    // ======================================
    // Initialize
    // ======================================

    function initializeHeader() {

        loadPlatform();

        loadPlatformLogo();

        loadInstitution();

        loadCurrentUser();

        setupLanguageSelector();

        setupLogout();

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initializeHeader
        );

    } else {

        initializeHeader();

    }


})();
</script>
