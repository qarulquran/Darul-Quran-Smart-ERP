<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Darul Quran Smart ERP</title>


<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f5f5;
    font-family:Arial,sans-serif;
}


.login-box{

    width:320px;
    padding:30px;
    background:white;
    border-radius:15px;
    box-shadow:0 0 20px #ccc;
    text-align:center;

}


h1{

    color:#0b6b3a;
    font-size:32px;

}


input{

    width:90%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;

}



button{

    width:95%;
    padding:12px;
    margin-top:15px;
    background:#0b6b3a;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;

}


button:hover{

    background:#07502b;

}


</style>


</head>



<body>



<div class="login-box">


<h1>
Darul Quran<br>
Smart ERP
</h1>



<input 
type="text" 
id="username"
placeholder="Username">



<input 
type="password"
id="password"
placeholder="Password">



<button onclick="login()">

Login

</button>



</div>





<script>


function login(){


let username = document.getElementById("username").value.trim();

let password = document.getElementById("password").value.trim();



if(username === "admin" && password === "12345"){


    window.location.href = "dashboard.html";


}

else{


    alert("Wrong Username or Password");


}


}



</script>




</body>

</html>
