<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Certificate Verification - Darul Quran ERP
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>


<div class="main">


<header class="topbar">


<h1>
Certificate Verification
</h1>


</header>







<div class="form-card">


<h2>
🔍 Verify Certificate
</h2>



<div class="field">


<label>
Certificate Number
</label>


<input

id="certificateNo"

placeholder="Enter Certificate No">


</div>





<button id="verifyBtn">

Verify Certificate

</button>




</div>









<div class="profile-card" id="certificateResult" style="display:none;">



<div class="student-info">


<h2 id="status">

</h2>



<p>

<b>
Certificate No:
</b>

<span id="showCertificateNo">
-
</span>

</p>





<p>

<b>
Student Name:
</b>

<span id="studentName">
-
</span>

</p>





<p>

<b>
Student Code:
</b>

<span id="studentCode">
-
</span>

</p>





<p>

<b>
Class:
</b>

<span id="studentClass">
-
</span>

</p>





<p>

<b>
Passing Year:
</b>

<span id="passingYear">
-
</span>

</p>




</div>



</div>






</div>





<script src="certificate-verification.js"></script>


</body>

</html>
