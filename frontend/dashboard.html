<!DOCTYPE html>
<html>
<head>

<title>Darul Quran Smart ERP Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
box-sizing:border-box;
font-family:Arial;
}

body{
margin:0;
background:#f5f5f5;
}


/* Top Bar */

.topbar{

height:60px;
background:#0b6b3a;
color:white;
display:flex;
align-items:center;
padding:0 20px;

}


.menu-btn{

font-size:30px;
cursor:pointer;
display:none;

}


/* Sidebar */

.sidebar{

position:fixed;
top:0;
left:-260px;
width:250px;
height:100vh;
background:#0b6b3a;
color:white;
padding:20px;
transition:.3s;

}


.sidebar.active{

left:0;

}


.logo{

font-size:25px;
font-weight:bold;
margin-bottom:40px;

}


.menu{

font-size:18px;
padding:15px;
margin:8px 0;
border-radius:10px;

}


.menu:hover{

background:#07552e;

}


/* Content */

.content{

padding:30px;

}


.card{

background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 0 10px #ccc;

}



/* Mobile */

@media(max-width:800px){

.menu-btn{

display:block;

}

.content{

padding:15px;

}


}


</style>


</head>


<body>


<div class="topbar">

<span class="menu-btn" onclick="toggleMenu()">☰</span>

<h2>Dashboard</h2>

</div>



<div class="sidebar" id="sidebar">


<div class="logo">
Darul Quran<br>
Smart ERP
</div>


<div class="menu">🏠 Dashboard</div>

<div class="menu">👨‍🎓 Students</div>

<div class="menu">📝 Admission</div>

<div class="menu">💰 Fee Collection</div>

<div class="menu">📅 Attendance</div>

<div class="menu">📚 Result</div>

<div class="menu">📜 Certificate</div>

<div class="menu">👨‍🏫 Teachers</div>

<div class="menu">⚙ Settings</div>


</div>




<div class="content">


<div class="card">

<h2>Welcome Admin</h2>

<p>Darul Quran Smart ERP Dashboard</p>

</div>



<div class="card">

<h3>Student Statistics</h3>

<p>Total Students : 500</p>

<p>Today's Attendance : 95%</p>


</div>


</div>



<script>


function toggleMenu(){

document.getElementById("sidebar").classList.toggle("active");

}


</script>



</body>

</html>
