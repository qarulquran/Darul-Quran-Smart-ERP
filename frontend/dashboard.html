<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Darul Quran Smart ERP Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{
background:#f4f7f6;
}


/* Header */

.header{

height:75px;
background:#0b6b3a;
color:white;

display:flex;
align-items:center;

padding:0 25px;

font-size:30px;
font-weight:bold;

}


.menu-btn{

font-size:35px;
cursor:pointer;
margin-right:20px;

}



/* Sidebar */

.sidebar{

position:fixed;

top:0;
left:-300px;

width:300px;
height:100%;

background:#075c32;

color:white;

padding:30px 20px;

transition:.4s;

z-index:10;

}


.sidebar.active{

left:0;

}


.logo{

font-size:30px;
font-weight:bold;

margin-bottom:40px;

}


.sidebar a{

display:block;

color:white;
text-decoration:none;

font-size:22px;

padding:18px;

border-radius:12px;

margin-bottom:8px;

}


.sidebar a:hover{

background:#064522;

}



/* Overlay */

.overlay{

position:fixed;

display:none;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.5);

z-index:5;

}


.overlay.active{

display:block;

}



/* Main */

.container{

padding:30px;

}



.welcome{

font-size:35px;
font-weight:bold;

margin-bottom:25px;

}


/* Cards */

.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:25px;

}


.card{

background:white;

padding:30px;

border-radius:25px;

box-shadow:0 10px 30px rgba(0,0,0,.12);

}


.card h3{

color:#666;

font-size:25px;

}


.card h1{

color:#0b6b3a;

font-size:50px;

margin-top:15px;

}


/* Chart */

.chart-box{

margin-top:35px;

background:white;

padding:30px;

border-radius:25px;

box-shadow:0 10px 30px rgba(0,0,0,.12);

}



@media(max-width:600px){

.container{

padding:20px;

}


.welcome{

font-size:28px;

}


.card h1{

font-size:40px;

}


}

</style>


</head>


<body>



<div class="sidebar" id="sidebar">


<div class="logo">

Darul Quran<br>
Smart ERP

</div>


<a href="#">🏠 Dashboard</a>

<a href="#">👨‍🎓 Students</a>

<a href="#">📝 Admission</a>

<a href="#">💰 Fee Collection</a>

<a href="#">📅 Attendance</a>

<a href="#">📚 Result</a>

<a href="#">📜 Certificate</a>

<a href="#">👨‍🏫 Teachers</a>

<a href="#">⚙ Settings</a>


</div>



<div class="overlay" id="overlay"></div>



<div class="header">


<div class="menu-btn" onclick="openMenu()">

☰

</div>


Dashboard


</div>



<div class="container">


<div class="welcome">

Welcome Admin

</div>



<div class="cards">


<div class="card">

<h3>Total Students</h3>

<h1>500</h1>

</div>



<div class="card">

<h3>Total Teachers</h3>

<h1>25</h1>

</div>



<div class="card">

<h3>Monthly Fee</h3>

<h1>৳75,000</h1>

</div>



<div class="card">

<h3>Attendance</h3>

<h1>95%</h1>

</div>


</div>




<div class="chart-box">


<h2>Student Growth</h2>

<br>

<canvas id="studentChart"></canvas>


</div>



</div>





<script>


function openMenu(){

document.getElementById("sidebar")
.classList.add("active");


document.getElementById("overlay")
.classList.add("active");

}



document.getElementById("overlay")
.onclick=function(){

document.getElementById("sidebar")
.classList.remove("active");


document.getElementById("overlay")
.classList.remove("active");


}





new Chart(

document.getElementById("studentChart"),

{

type:"bar",

data:{


labels:[

"Class 1",
"Class 2",
"Class 3",
"Class 4",
"Class 5"

],


datasets:[{

label:"Students",

data:[80,120,100,150,50],

backgroundColor:"#0b6b3a"


}]


}

}


);



</script>



</body>

</html>
