<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Darul Quran Smart ERP Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}


body{

    background:#f4f7f5;

}


/* Header */

.header{

    background:#076b3a;
    color:white;
    padding:20px;
    display:flex;
    align-items:center;
    gap:20px;

}


.menu{

    font-size:35px;
    cursor:pointer;

}


.header h1{

    font-size:30px;

}



/* Main */

.container{

    padding:25px;

}



.welcome{

    background:white;
    padding:30px;
    border-radius:25px;
    box-shadow:0 8px 25px rgba(0,0,0,0.12);
    margin-bottom:25px;

}


.welcome h2{

    font-size:35px;
    margin-bottom:15px;

}


.welcome p{

    font-size:20px;
    color:#555;

}



/* Cards */

.cards{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;

}


.card{

    background:white;
    padding:25px;
    border-radius:25px;
    box-shadow:0 8px 25px rgba(0,0,0,0.12);

}


.card h3{

    color:#666;
    font-size:22px;

}


.card h1{

    margin-top:15px;
    font-size:45px;
    color:#076b3a;

}



/* Charts */

.chart-box{

    background:white;
    margin-top:25px;
    padding:25px;
    border-radius:25px;
    box-shadow:0 8px 25px rgba(0,0,0,0.12);

}


.chart-box h2{

    margin-bottom:20px;
    font-size:30px;

}


canvas{

    max-height:300px;

}



/* Mobile */

@media(max-width:600px){

.header h1{

font-size:25px;

}


.container{

padding:15px;

}


.welcome h2{

font-size:28px;

}


.card h1{

font-size:38px;

}


.chart-box h2{

font-size:25px;

}


}


</style>


</head>


<body>



<div class="header">

<div class="menu">
☰
</div>

<h1>
Dashboard
</h1>

</div>



<div class="container">


<div class="welcome">

<h2>
Welcome Admin
</h2>

<p>
Darul Quran Smart ERP Dashboard
</p>

</div>



<div class="cards">


<div class="card">

<h3>Total Students</h3>

<h1>500</h1>

</div>



<div class="card">

<h3>Total Teachers</h3>

<h1>25</h1>

</div>



<div class="card">

<h3>Monthly Fee</h3>

<h1>৳75,000</h1>

</div>



<div class="card">

<h3>Attendance</h3>

<h1>95%</h1>

</div>


</div>




<div class="chart-box">

<h2>
Student Growth
</h2>

<canvas id="studentChart"></canvas>

</div>




<div class="chart-box">

<h2>
Attendance Report
</h2>

<canvas id="attendanceChart"></canvas>

</div>




<div class="chart-box">

<h2>
Monthly Income
</h2>

<canvas id="incomeChart"></canvas>

</div>



</div>





<script>


new Chart(
document.getElementById("studentChart"),
{

type:"bar",

data:{

labels:[
"Class 1",
"Class 2",
"Class 3",
"Class 4",
"Class 5"
],

datasets:[{

label:"Students",

data:[
80,
120,
100,
150,
50
],

backgroundColor:"#076b3a"

}]

}

});





new Chart(
document.getElementById("attendanceChart"),
{

type:"doughnut",

data:{

labels:[
"Present",
"Absent"
],

datasets:[{

data:[
95,
5
],

backgroundColor:[
"#076b3a",
"#e74c3c"
]

}]

}

});





new Chart(
document.getElementById("incomeChart"),
{

type:"line",

data:{

labels:[
"Jan",
"Feb",
"Mar",
"Apr",
"May"
],

datasets:[{

label:"Income",

data:[
30000,
45000,
50000,
60000,
75000
],

borderColor:"#076b3a",

tension:0.4

}]

}

});



</script>



</body>

</html>
