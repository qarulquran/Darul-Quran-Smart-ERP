<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Fee Collection - Darul Quran Smart ERP
</title>

<link rel="stylesheet" href="fee.css">

</head>


<body>


<div class="main">


<header class="topbar">


<h1>
💰 Fee Collection
</h1>


<div class="admin-profile">

Admin 👤

<a href="dashboard.html">
🏠 Dashboard
</a>


<button onclick="logout()">
🚪 Logout
</button>

</div>


</header>





<div class="container">



<div class="card">


<h2>
Collect Student Fee
</h2>



<label>
Student Code
</label>


<div class="search-area">


<input
type="text"
id="studentCodeInput"
placeholder="Enter Student Code"
autocomplete="off">


<button
type="button"
onclick="searchStudent()">

Search

</button>


</div>





<div class="student-info">


<h3>
Student Information
</h3>


<p>
Name:
<span id="studentName">
-
</span>
</p>


<p>
Class:
<span id="studentClass">
-
</span>
</p>


<p>
Father Name:
<span id="fatherName">
-
</span>
</p>



</div>







<label>
Fee Type
</label>


<select id="feeType">


<option value="Monthly Fee">
Monthly Fee
</option>


<option value="Admission Fee">
Admission Fee
</option>


<option value="Exam Fee">
Exam Fee
</option>


<option value="ID Card Fee">
ID Card Fee
</option>


<option value="Book Fee">
Book Fee
</option>


<option value="Uniform Fee">
Uniform Fee
</option>


<option value="Tour Fee">
Tour Fee
</option>


<option value="Certificate Fee">
Certificate Fee
</option>


<option value="Other Fee">
Other Fee
</option>


</select>







<label>
Month
</label>


<select id="feeMonth">


<option value="January">
January
</option>

<option value="February">
February
</option>

<option value="March">
March
</option>

<option value="April">
April
</option>

<option value="May">
May
</option>

<option value="June">
June
</option>

<option value="July">
July
</option>

<option value="August">
August
</option>

<option value="September">
September
</option>

<option value="October">
October
</option>

<option value="November">
November
</option>

<option value="December">
December
</option>


</select>






<label>
Amount
</label>


<input
type="number"
id="amount"
placeholder="Enter Amount"
min="0"
step="0.01">







<label>
Payment Method
</label>


<select id="paymentMethod">


<option value="Cash">
Cash
</option>


<option value="Mobile Banking">
Mobile Banking
</option>


<option value="Bank">
Bank
</option>


</select>







<button
class="save-btn"
type="button"
onclick="saveFee()">

Save Payment

</button>





<button
class="receipt-btn"
type="button"
onclick="openReceipt()">

🧾 Generate Receipt

</button>




</div>



</div>



</div>





<!-- ===============================
     Core Configuration
================================ -->


<script src="../config/app-config.js"></script>

<script src="../config/language-config.js"></script>

<script src="../config/permission-config.js"></script>


<!-- ===============================
     Core Architecture
================================ -->


<script src="../core/institute.js"></script>

<script src="../core/session.js"></script>

<script src="../core/auth.js"></script>

<script src="../core/database-manager.js"></script>

<script src="../core/bootstrap.js"></script>


<!-- ===============================
     Fee System
================================ -->


<script src="fee.js"></script>


</body>

</html>
