<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Fee Collection - Darul Quran Ahmadia Madrasah
</title>


<link rel="stylesheet" href="fee.css">


</head>


<body>



<div class="container">



<header class="header">

<h1>
💰 Fee Collection
</h1>


<p>
দারুল কুরআন আহমদিয়া মাদরাসা
</p>


<div>
Admin 👤
</div>


</header>







<!-- Student Search -->


<div class="card">


<h2>
👨‍🎓 Student Search
</h2>


<div class="row">


<div class="input-box">


<label>
Student Code
</label>


<input

type="text"

id="studentCode"

placeholder="Enter Student ID">


</div>



<button id="searchStudent">

🔍 Search

</button>


</div>


</div>










<!-- Student Information -->


<div class="card student-card" id="studentInfo">


<h2>
Student Information
</h2>



<div class="student-data">


<img

id="studentPhoto"

src="https://via.placeholder.com/120"

alt="Student Photo">





<div>


<p>
<b>Name:</b>

<span id="studentName">
-
</span>

</p>



<p>
<b>Student ID:</b>

<span id="showStudentCode">
-
</span>

</p>




<p>
<b>Class:</b>

<span id="studentClass">
-
</span>

</p>



<p>
<b>Father Name:</b>

<span id="fatherName">
-
</span>

</p>



<p>
<b>Guardian Mobile:</b>

<span id="guardianMobile">
-
</span>

</p>


</div>



</div>


</div>










<!-- Payment Entry -->


<div class="card">


<h2>
💳 Payment Entry
</h2>



<div class="row">



<div class="input-box">


<label>
Fee Type
</label>


<select id="feeType">


<option>
Monthly Fee
</option>


<option>
Admission Fee
</option>


<option>
Exam Fee
</option>


<option>
ID Card Fee
</option>


<option>
Certificate Fee
</option>


</select>


</div>








<div class="input-box">


<label>
Month
</label>


<select id="month">


<option>
January
</option>


<option>
February
</option>


<option>
March
</option>


<option>
April
</option>


<option>
May
</option>


<option>
June
</option>


<option>
July
</option>


<option>
August
</option>


<option>
September
</option>


<option>
October
</option>


<option>
November
</option>


<option>
December
</option>


</select>


</div>




</div>








<div class="row">


<div class="input-box">


<label>
Amount
</label>


<input

type="number"

id="amount"

placeholder="Enter Amount">


</div>






<div class="input-box">


<label>
Payment Method
</label>


<select id="paymentMethod">


<option>
Cash
</option>


<option>
Bank
</option>


<option>
Bkash
</option>


<option>
Nagad
</option>


</select>


</div>



</div>





</div>










<button class="save-btn" id="savePayment">

💾 Save Payment

</button>







</div>






<script src="fee.js"></script>


</body>


</html>
