<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Fee Collection - Darul Quran Ahmadia Madrasah
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<div class="main">



<header class="topbar">

<h1>
💰 Fee Collection
</h1>


<div class="admin-profile">
Admin 👤
</div>


</header>








<!-- Student Search -->


<div class="form-card">


<h2>
👨‍🎓 Student Information
</h2>



<div class="form-grid">



<div class="field">


<label>
Student Code
</label>


<input

type="text"

id="studentCode"

placeholder="Enter Student ID">


</div>





<div class="field">


<button id="searchStudent">

🔍 Search Student

</button>


</div>



</div>




</div>









<!-- Student Preview -->


<div class="profile-card" id="studentInfo" style="display:none;">



<div class="student-photo">


<img

id="studentPhoto"

src="https://via.placeholder.com/120"

width="120">


</div>





<div class="student-info">


<h2 id="studentName">
-
</h2>


<p>

<b>
Student ID:
</b>

<span id="showStudentCode">
-
</span>

</p>



<p>

<b>
Class:
</b>

<span id="studentClass">
-
</span>

</p>



<p>

<b>
Father Name:
</b>

<span id="fatherName">
-
</span>

</p>




<p>

<b>
Guardian Mobile:
</b>

<span id="guardianMobile">
-
</span>

</p>



</div>



</div>









<!-- Fee Entry -->


<div class="form-card">


<h2>
💳 Payment Entry
</h2>




<div class="form-grid">





<div class="field">


<label>
Fee Type
</label>


<select id="feeType">


<option>
Monthly Fee
</option>


<option>
Admission Fee
</option>


<option>
Exam Fee
</option>


<option>
ID Card Fee
</option>


<option>
Certificate Fee
</option>


</select>


</div>








<div class="field">


<label>
Month
</label>


<select id="month">


<option>
January
</option>


<option>
February
</option>


<option>
March
</option>


<option>
April
</option>


<option>
May
</option>


<option>
June
</option>


<option>
July
</option>


<option>
August
</option>


<option>
September
</option>


<option>
October
</option>


<option>
November
</option>


<option>
December
</option>


</select>


</div>








<div class="field">


<label>
Amount
</label>


<input

type="number"

id="amount"

placeholder="Enter Amount">


</div>








<div class="field">


<label>
Payment Method
</label>


<select id="paymentMethod">


<option>
Cash
</option>


<option>
Bank
</option>


<option>
Bkash
</option>


</select>


</div>






</div>




</div>









<div class="submit-area">


<button id="savePayment">

💾 Save Payment

</button>


</div>








</div>






<script src="fee.js"></script>


</body>

</html>
