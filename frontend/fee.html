<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Fee Collection - Darul Quran ERP
</title>

<link rel="stylesheet" href="fee.css">

</head>


<body>


<div class="main">


<header class="topbar">


<h1>
💰 Fee Collection
</h1>


<div class="admin-profile">

Admin 👤

<a href="dashboard.html">
🏠 Dashboard
</a>


<button onclick="logout()">
🚪 Logout
</button>


</div>


</header>





<div class="container">



<div class="card">


<h2>
Collect Student Fee
</h2>



<label>
Student Code
</label>


<div class="search-area">


<input 
type="text"
id="studentCodeInput"
placeholder="Enter Student Code">


<button onclick="searchStudent()">
Search
</button>


</div>






<div class="student-info">


<h3>
Student Information
</h3>


<p>
Name:
<span id="studentName">
-
</span>
</p>


<p>
Class:
<span id="studentClass">
-
</span>
</p>


<p>
Father Name:
<span id="fatherName">
-
</span>
</p>



</div>







<label>
Fee Type
</label>


<select id="feeType">


<option>
Monthly Fee
</option>


<option>
Admission Fee
</option>


<option>
Exam Fee
</option>


<option>
Other
</option>


</select>







<label>
Month
</label>


<select id="feeMonth">


<option>
January
</option>

<option>
February
</option>

<option>
March
</option>

<option>
April
</option>

<option>
May
</option>

<option>
June
</option>

<option>
July
</option>

<option>
August
</option>

<option>
September
</option>

<option>
October
</option>

<option>
November
</option>

<option>
December
</option>


</select>






<label>
Amount
</label>


<input

type="number"

id="amount"

placeholder="Enter Amount">







<label>
Payment Method
</label>


<select id="paymentMethod">


<option>
Cash
</option>


<option>
Mobile Banking
</option>


<option>
Bank
</option>


</select>







<button class="save-btn" onclick="saveFee()">

Save Payment

</button>





<button class="receipt-btn" onclick="openReceipt()">

🧾 Generate Receipt

</button>




</div>



</div>



</div>






<script src="script.js"></script>

<script src="fee.js"></script>


</body>


</html>
