<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Student Profile - Darul Quran ERP
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>


<div class="main">



<header class="topbar">


<h1>
Student Profile
</h1>


<div class="admin-profile">
Admin 👤
</div>


</header>







<!-- Student Main Profile -->


<div class="profile-card">





<div class="student-photo">


<img

id="studentPhoto"

src="https://via.placeholder.com/150"

alt="Student Photo">


</div>







<div class="student-info">



<h2 id="studentName">
Loading...
</h2>





<p>

<b>
Student Code:
</b>

<span id="studentCode">
-
</span>

</p>





<p>

<b>
Father Name:
</b>

<span id="fatherName">
-
</span>

</p>





<p>

<b>
Mother Name:
</b>

<span id="motherName">
-
</span>

</p>





<p>

<b>
Date of Birth:
</b>

<span id="dateOfBirth">
-
</span>

</p>





<p>

<b>
Blood Group:
</b>

<span id="bloodGroup">
-
</span>

</p>





<p>

<b>
Class:
</b>

<span id="studentClass">
-
</span>

</p>





<p>

<b>
Mobile:
</b>

<span id="mobile">
-
</span>

</p>





<p>

<b>
Admission Date:
</b>

<span id="admissionDate">
-
</span>

</p>





<p>

<b>
Address:
</b>

<span id="address">
-
</span>

</p>





</div>


</div>









<!-- Parent Information -->


<div class="form-card">


<h2>
👨‍👩‍👦 Parent Information
</h2>



<p>

<b>
Father NID:
</b>

<span id="fatherNid">
-
</span>

</p>



<p>

<b>
Mother NID:
</b>

<span id="motherNid">
-
</span>

</p>



</div>










<!-- Academic Status -->


<div class="status-cards">





<div class="card">


<h2 id="attendance">
0%
</h2>


<p>
Attendance
</p>


</div>







<div class="card">


<h2 id="feeStatus">
Due
</h2>


<p>
Fee Status
</p>


</div>







<div class="card">


<h2 id="result">
-
</h2>


<p>
Last Result
</p>


</div>





</div>










</div>






<script src="student-profile.js"></script>



</body>


</html>
