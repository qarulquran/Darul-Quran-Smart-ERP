<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Result Management - Darul Quran ERP
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<div class="main">



<header class="topbar">


<h1>
Result Management
</h1>


<div class="admin-profile">
Admin 👤
</div>


</header>








<div class="form-card">


<h2>
📚 Student Search
</h2>




<div class="form-grid">


<div class="field">


<label>
Student Code
</label>


<input

id="studentCode"

placeholder="Enter Student Code">


</div>




<div class="field">


<button id="searchStudent">

🔍 Search

</button>


</div>



</div>


</div>








<div class="profile-card" id="studentInfo" style="display:none;">


<div class="student-info">


<h2 id="studentName">
-
</h2>


<p>

<b>
Class:
</b>

<span id="studentClass"></span>

</p>


<p>

<b>
Code:
</b>

<span id="showCode"></span>

</p>


</div>


</div>










<div class="form-card">


<h2>
📝 Result Entry
</h2>





<div class="field">


<label>
Exam Name
</label>


<select id="exam">


<option>
First Term
</option>


<option>
Half Yearly
</option>


<option>
Final Exam
</option>


</select>


</div>








<table>


<thead>

<tr>

<th>
Subject
</th>


<th>
Mark
</th>


</tr>


</thead>



<tbody>



<tr>

<td>
Quran
</td>

<td>

<input type="number" id="quran">

</td>

</tr>





<tr>

<td>
Bangla
</td>

<td>

<input type="number" id="bangla">

</td>

</tr>






<tr>

<td>
English
</td>

<td>

<input type="number" id="english">

</td>

</tr>






<tr>

<td>
Math
</td>

<td>

<input type="number" id="math">

</td>

</tr>




</tbody>


</table>








</div>








<div class="submit-area">


<button id="saveResult">

💾 Save Result

</button>


</div>






</div>






<script src="result.js"></script>


</body>


</html>
