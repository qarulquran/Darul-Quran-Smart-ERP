/* ==========================================

========================================== */

.admission-page {

}

}


/* ==========================================
   Admission Heading
========================================== */

.admission-page .title-card {

    position: relative;

    overflow: hidden;

}


.admission-title-row {

    display: flex;

    align-items: flex-start;

    justify-content: space-between;

    gap: 18px;

}


.admission-title-main {

    min-width: 0;

}


.admission-title-main h1 {

    display: flex;

    align-items: center;

    gap: 10px;

}


.admission-title-main p {

    display: flex;

    align-items: center;

    gap: 5px;

    flex-wrap: wrap;

}


.current-institution {

    color: #087f3d;

    font-weight: 700;

}


.back-students-btn {

    flex: 0 0 auto;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

    min-height: 40px;

    padding:
        0 13px;

    border:
        1px solid #d8e9df;

    border-radius: 11px;

    background: #f2faf5;

    color: #087f3d;

    text-decoration: none;

    font-size: 12px;

    font-weight: 700;

}


.back-students-btn:hover {

    background: #e8f6ed;

}


/* ==========================================
   Modern Date of Birth
========================================== */

.dob-picker {

    display: grid;

    grid-template-columns:
        0.75fr
        1.25fr
        1fr;

    gap: 8px;

    width: 100%;

}


.dob-picker select,
.dob-picker input {

    width: 100%;

    min-width: 0;

    height: 48px;

    padding:
        0 11px !important;

    border:
        1px solid #dddddd;

    border-radius:
        14px;

    background:
        #ffffff;

    color:
        #333333;

    font-size:
        14px;

    outline:
        none;

}


.dob-picker select:focus,
.dob-picker input:focus {

    border-color:
        #087f3d;

    box-shadow:
        0 0 0 3px
        rgba(8,127,61,0.10);

}


.dob-year {

    text-align: center;

}


.dob-help {

    display: block;

    margin-top: 7px;

    color: #7a7f85;

    font-size: 11px;

    line-height: 1.4;

}


/* ==========================================
   Required Indicator
========================================== */

.required {

    color: #c62828;

}


/* ==========================================
   Save Area
========================================== */

.submit-area {

    padding-bottom: 25px;

/* ==========================================
   RTL Form Support
========================================== */

html[dir="rtl"] {

    direction: rtl;

html[dir="rtl"]
.form-card h2 {

    border-right:

    padding-left: 0;

html[dir="rtl"]
.admission-title-row {

}


html[dir="rtl"]

/* ==========================================
   Mobile
========================================== */

@media
(max-width: 700px) {

<script>

(function () {

    "use strict";


    function loadAdmissionInstitution() {

        const element =
            document.getElementById(
                "admissionInstitutionName"
            );


        if (!element) {

            return;

        }


        if (
            typeof window.getInstitutionName
            ===
            "function"
        ) {

            element.textContent =
                window.getInstitutionName()
                ||
                "Current Institution";

            return;

        }


        if (
            typeof window.getInstitution
            ===
            "function"
        ) {

            const institution =
                window.getInstitution();


            if (institution) {

                element.textContent =
                    institution.name
                    ||
                    "Current Institution";

            }

        }

    }


    loadAdmissionInstitution();


    document.addEventListener(
        "erpReady",
        loadAdmissionInstitution
    );


    document.addEventListener(
        "ismLayoutReady",
        loadAdmissionInstitution
    );


})();

</script>



<!-- ==========================================
     Modern DOB Controller
========================================== -->

<script>

(function () {

    "use strict";


    const dayElement =
        document.getElementById(
            "dobDay"
        );


    const monthElement =
        document.getElementById(
            "dobMonth"
        );


    const yearElement =
        document.getElementById(
            "dobYear"
        );


    const dateElement =
        document.getElementById(
            "dateOfBirth"
        );


    if (
        !dayElement
        ||
        !monthElement
        ||
        !yearElement
        ||
        !dateElement
    ) {

        return;

    }


    const currentYear =
        new Date()
            .getFullYear();


    /* ======================================
       Translate Helper
    ====================================== */

    function text(
        key,
        fallback
    ) {

        if (
            typeof window.translate
            ===
            "function"
        ) {

            const result =
                window.translate(
                    key
                );


            if (
                result
                &&
                result !== key
            ) {

                return result;

            }

        }


        return fallback;

    }


    /* ======================================
       Year Cleaning
    ====================================== */

    yearElement.addEventListener(
        "input",
        function () {

            yearElement.value =
                yearElement.value
                    .replace(
                        /\D/g,
                        ""
                    )
                    .slice(
                        0,
                        4
                    );


            refreshDays();

            syncDOB();

        }
    );


    /* ======================================
       Days in Selected Month
    ====================================== */

    function getMaximumDays() {

        const month =
            Number(
                monthElement.value
            );


        const year =
            Number(
                yearElement.value
            );


        if (!month) {

            return 31;

        }


        const safeYear =
            (
                year >= 1900
                &&
                year <= currentYear
            )

                ?

                year

                :

                2000;


        return new Date(
            safeYear,
            month,
            0
        )
        .getDate();

    }


    /* ======================================
       Render Day Options
    ====================================== */

    function refreshDays() {

        const oldValue =
            dayElement.value;


        const maxDays =
            getMaximumDays();


        dayElement.innerHTML =
            "";


        const placeholder =
            document.createElement(
                "option"
            );


        placeholder.value =
            "";


        placeholder.textContent =
            text(
                "birthDay",
                "Day"
            );


        dayElement.appendChild(
            placeholder
        );


        for (
            let number = 1;
            number <= maxDays;
            number++
        ) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                String(
                    number
                )
                .padStart(
                    2,
                    "0"
                );


            option.textContent =
                String(
                    number
                );


            dayElement.appendChild(
                option
            );

        }


        if (
            oldValue
            &&
            Number(oldValue)
            <= maxDays
        ) {

            dayElement.value =
                oldValue;

        }

    }


    /* ======================================
       Build YYYY-MM-DD
    ====================================== */

    function syncDOB() {

        const day =
            dayElement.value;


        const month =
            monthElement.value;


        const year =
            Number(
                yearElement.value
            );


        if (
            !day
            ||
            !month
            ||
            !Number.isInteger(year)
            ||
            year < 1900
            ||
            year > currentYear
        ) {

            dateElement.value =
                "";

            return;

        }


        dateElement.value =
            String(year)

            +

            "-"

            +

            month

            +

            "-"

            +

            day;

    }


    monthElement.addEventListener(
        "change",
        function () {

            refreshDays();

            syncDOB();

        }
    );


    dayElement.addEventListener(
        "change",
        syncDOB
    );


    document.addEventListener(
        "ismLanguageReady",
        refreshDays
    );


    document.addEventListener(
        "ismLanguageChanged",
        refreshDays
    );


    refreshDays();


})();

</script>



<!-- ==========================================
     Same Address Helper
========================================== -->

<script>

(function () {

    "use strict";


    const checkbox =
        document.getElementById(
            "sameAddress"
        );


    const permanent =
        document.getElementById(
            "permanentAddress"
        );


    if (
        !checkbox
        ||
        !permanent
    ) {

        return;

    }


    function buildPresentAddress() {

        const ids = [

            "village",
            "wardSearch",
            "unionSearch",
            "thanaSearch",
            "districtSearch",
            "divisionSearch",
            "presentAddress"

        ];


        return ids
            .map(
                function (id) {

                    const element =
                        document.getElementById(
                            id
                        );


                    return element
                        ?
                        element.value.trim()
                        :
                        "";

                }
            )
            .filter(Boolean)
            .join(", ");

    }


    checkbox.addEventListener(
        "change",
        function () {

            if (
                checkbox.checked
            ) {

                permanent.value =
                    buildPresentAddress();

            }

        }
    );


})();

</script>
