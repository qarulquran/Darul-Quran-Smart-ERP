<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Add Student - Darul Quran Smart ERP
</title>


<link rel="stylesheet" href="add-student.css">

<link rel="stylesheet" href="custom-dropdown.css">


</head>


<body>


<div class="header">

<button id="menuBtn">
☰
</button>

<h2>
Add New Student
</h2>

</div>



<div class="container">



<div class="title-card">

<h1>
🧑‍🎓 Student Admission Form
</h1>

<p>
Darul Quran Smart ERP
</p>

</div>





<!-- ==========================================
     Student Information
========================================== -->


<div class="form-card">


<h2>
👤 Student Information
</h2>



<div class="form-grid">



<div class="field">

<label>
Student Name *
</label>

<input
id="studentName"
type="text"
placeholder="Enter student name">

</div>




<div class="field">

<label>
Date of Birth
</label>

<input
id="dateOfBirth"
type="date">

</div>




<div class="field">

<label>
Birth Registration Number
</label>

<input
id="birthRegistration"
type="text"
placeholder="Enter birth registration number">

</div>




<div class="field">

<label>
Blood Group
</label>


<select id="bloodGroup">


<option value="">
Select Blood Group
</option>

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>


</select>


</div>





<div class="field">

<label>
Nationality
</label>


<input
id="nationality"
type="text"
value="Bangladeshi">


</div>





<div class="field">

<label>
Student Photo
</label>


<input
id="studentPhoto"
type="file"
accept="image/*">


</div>



</div>


</div>







<!-- ==========================================
     Parents Information
========================================== -->


<div class="form-card">


<h2>
👨‍👩‍👦 Parents Information
</h2>



<div class="form-grid">



<div class="field">

<label>
Father Name *
</label>


<input
id="fatherName"
type="text"
placeholder="Enter father name">


</div>




<div class="field">

<label>
Father NID Number
</label>


<input
id="fatherNid"
type="text"
placeholder="Enter father NID">


</div>




<div class="field">

<label>
Mother Name *
</label>


<input
id="motherName"
type="text"
placeholder="Enter mother name">


</div>




<div class="field">

<label>
Mother NID Number
</label>


<input
id="motherNid"
type="text"
placeholder="Enter mother NID">


</div>




<div class="field">

<label>
Guardian Mobile Number
</label>


<input
id="guardianMobile"
type="tel"
inputmode="numeric"
placeholder="Enter mobile number">


</div>



</div>


</div>






<!-- ==========================================
     Previous Education
========================================== -->


<div class="form-card">


<h2>
📚 Previous Education
</h2>


<div class="form-grid">


<div class="field">

<label>
Previous Institution Name
</label>


<input
id="previousInstitution"
type="text"
placeholder="Enter previous institution name">


</div>




<div class="field">

<label>
Previous Class
</label>


<select id="previousClass">


<option value="">
Select Previous Class
</option>

<option>Play</option>
<option>Nursery</option>
<option>Class 1</option>
<option>Class 2</option>
<option>Class 3</option>
<option>Class 4</option>
<option>Class 5</option>
<option>Class 6</option>
<option>Class 7</option>
<option>Class 8</option>
<option>Class 9</option>
<option>Class 10</option>


</select>


</div>


</div>


</div>







<!-- ==========================================
     Admission Information
========================================== -->


<div class="form-card">


<h2>
📝 Admission Information
</h2>


<div class="form-grid">


<div class="field">


<label>
Admission Class *
</label>


<select id="admissionClass">


<option value="">
Select Class
</option>


<option>Play</option>
<option>Nursery</option>
<option>Class 1</option>
<option>Class 2</option>
<option>Class 3</option>
<option>Class 4</option>
<option>Class 5</option>
<option>Class 6</option>
<option>Class 7</option>
<option>Class 8</option>
<option>Class 9</option>
<option>Class 10</option>


</select>


</div>





<div class="field">


<label>
Admission Date
</label>


<input
id="admissionDate"
type="date">


</div>



</div>


</div>








<!-- ==========================================
     Present Address
========================================== -->


<div class="form-card">


<h2>
📍 Present Address
</h2>



<div class="form-grid">





<div class="field">

<label>
Division
</label>


<div class="smart-select">


<input
id="divisionSearch"
placeholder="Search Division"
autocomplete="off">


<div
id="divisionList"
class="dropdown-list">

</div>


</div>


</div>







<div class="field">

<label>
District
</label>


<div class="smart-select">


<input
id="districtSearch"
placeholder="Search District"
autocomplete="off">


<div
id="districtList"
class="dropdown-list">

</div>


</div>


</div>







<div class="field">

<label>
Thana / Upazila
</label>


<div class="smart-select">


<input
id="thanaSearch"
placeholder="Search Thana"
autocomplete="off">


<div
id="thanaList"
class="dropdown-list">

</div>


</div>


</div>







<div class="field">

<label>
Union
</label>


<div class="smart-select">


<input
id="unionSearch"
placeholder="Search Union"
autocomplete="off">


<div
id="unionList"
class="dropdown-list">

</div>


</div>


</div>







<div class="field">

<label>
Ward
</label>


<div class="smart-select">


<input
id="wardSearch"
placeholder="Search Ward"
autocomplete="off">


<div
id="wardList"
class="dropdown-list">

</div>


</div>


</div>







<div class="field">


<label>
Village / Area
</label>


<input
id="village"
type="text"
placeholder="Enter village name">


</div>







<div class="field">


<label>
House / Road / Landmark
</label>


<textarea
id="presentAddress"
placeholder="Enter full address"></textarea>


</div>





</div>


</div>








<!-- ==========================================
     Permanent Address
========================================== -->


<div class="form-card">


<h2>
🏠 Permanent Address
</h2>



<label class="check">


<input
id="sameAddress"
type="checkbox">


Same as Present Address


</label>





<textarea
id="permanentAddress"
placeholder="Enter permanent address"></textarea>




</div>








<!-- ==========================================
     Save
========================================== -->


<div class="submit-area">


<button
type="button"
id="saveStudentBtn">

💾 Save Student

</button>


</div>





</div>






<!-- ==========================================
     Core Configuration
========================================== -->


<script src="../config/app-config.js"></script>

<script src="../config/language-config.js"></script>

<script src="../config/permission-config.js"></script>



<!-- ==========================================
     Core Architecture
========================================== -->


<script src="../core/institute.js"></script>

<script src="../core/session.js"></script>

<script src="../core/auth.js"></script>

<script src="../core/database-manager.js"></script>

<script src="../core/bootstrap.js"></script>



<!-- ==========================================
     Existing Application Scripts
========================================== -->


<script src="student-data.js"></script>

<script src="custom-dropdown.js"></script>

<script src="add-student.js"></script>



</body>

</html>
