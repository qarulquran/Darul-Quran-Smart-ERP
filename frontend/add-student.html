<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Student - Darul Quran Smart ERP</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="main">


<header class="topbar">

<h1>Add New Student</h1>

<div class="admin-profile">
Admin 👤
</div>

</header>




<div class="form-box">


<h2>Student Information</h2>



<form>


<div class="form-grid">



<div>

<label>
Student Name
</label>

<input 
id="studentName"
type="text"
placeholder="Enter student name">

</div>



<div>

<label>
Father Name
</label>

<input 
id="fatherName"
type="text"
placeholder="Enter father name">

</div>



<div>

<label>
Mother Name
</label>

<input 
id="motherName"
type="text"
placeholder="Enter mother name">

</div>



<div>

<label>
Date of Birth
</label>

<input 
id="dob"
type="date">

</div>




<div>

<label>
Class
</label>


<select id="className">

<option value="">
Select Class
</option>

<option>
Class 1
</option>

<option>
Class 2
</option>

<option>
Class 3
</option>

<option>
Class 4
</option>

<option>
Class 5
</option>

<option>
Class 6
</option>

<option>
Class 7
</option>

<option>
Class 8
</option>


</select>


</div>




<div>

<label>
Mobile Number
</label>

<input
id="mobile"
type="number"
placeholder="017XXXXXXXX">

</div>




<div>

<label>
Admission Date
</label>

<input
id="admissionDate"
type="date">

</div>



<div>

<label>
Student Photo
</label>

<input
id="photo"
type="file">

</div>



</div>





<div>

<label>
Address
</label>


<textarea
id="address"
placeholder="Enter address">
</textarea>


</div>





<button 
type="button"
onclick="addStudent()">

Save Student

</button>




</form>


</div>


</div>





<script src="add-student.js"></script>


</body>

</html>
