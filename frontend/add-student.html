
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Student</title>


<link rel="stylesheet" href="add-student.css">

<link rel="stylesheet" href="custom-dropdown.css">


</head>


<body>



<div class="header">

<button id="menuBtn">
☰
</button>

<h2>
Add New Student
</h2>

</div>




<div class="container">



<div class="title-card">

<h1>
🧑‍🎓 Student Admission Form
</h1>

<p>
Darul Quran Smart ERP
</p>

</div>







<!-- Student Information -->


<div class="form-card">


<h2>
👤 Student Information
</h2>



<div class="form-grid">



<div class="field">

<label>
Student Name *
</label>

<input 
type="text"
name="studentName"
placeholder="Enter student name">


</div>





<div class="field">

<label>
Date of Birth
</label>


<input type="date">


</div>





<div class="field">

<label>
Birth Registration Number
</label>


<input 
type="text"
placeholder="Enter birth registration number">


</div>





<div class="field">

<label>
Blood Group
</label>


<select>


<option>
Select Blood Group
</option>

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>


</select>


</div>






<div class="field">

<label>
Nationality
</label>


<input 
type="text"
value="Bangladeshi">


</div>






<div class="field">

<label>
Student Photo
</label>


<input 
type="file"
accept="image/*">


</div>




</div>


</div>









<!-- Parents Information -->


<div class="form-card">


<h2>
👨‍👩‍👦 Parents Information
</h2>



<div class="form-grid">



<div class="field">

<label>
Father Name *
</label>


<input 
type="text"
placeholder="Enter father name">


</div>





<div class="field">

<label>
Father NID Number
</label>


<input 
type="text"
placeholder="Enter father NID">


</div>





<div class="field">

<label>
Mother Name *
</label>


<input 
type="text"
placeholder="Enter mother name">


</div>





<div class="field">

<label>
Mother NID Number
</label>


<input 
type="text"
placeholder="Enter mother NID">


</div>





<div class="field">

<label>
Guardian Mobile Number
</label>


<input 
type="number"
placeholder="Enter mobile number">


</div>



</div>



<!-- Previous Education -->


<div class="form-card">


<h2>
📚 Previous Education
</h2>


<div class="form-grid">


<div class="field">

<label>
Previous Institution Name
</label>


<input 
type="text"
placeholder="Enter previous institution name">


</div>



<div class="field">

<label>
Previous Class
</label>


<select>


<option>
Select Previous Class
</option>

<option>Play</option>

<option>Nursery</option>

<option>Class 1</option>

<option>Class 2</option>

<option>Class 3</option>

<option>Class 4</option>

<option>Class 5</option>

<option>Class 6</option>

<option>Class 7</option>

<option>Class 8</option>

<option>Class 9</option>

<option>Class 10</option>


</select>


</div>


</div>


</div>







<!-- Admission Information -->


<div class="form-card">


<h2>
📝 Admission Information
</h2>


<div class="form-grid">


<div class="field">


<label>
Admission Class *
</label>


<select>


<option>
Select Class
</option>


<option>Play</option>

<option>Nursery</option>

<option>Class 1</option>

<option>Class 2</option>

<option>Class 3</option>

<option>Class 4</option>

<option>Class 5</option>

<option>Class 6</option>

<option>Class 7</option>

<option>Class 8</option>

<option>Class 9</option>

<option>Class 10</option>


</select>


</div>




<div class="field">


<label>
Admission Date
</label>


<input type="date">


</div>


</div>


</div>








<!-- Smart Address -->


<div class="form-card">


<h2>
📍 Present Address
</h2>




<div class="form-grid">



<div class="field">

<label>
Division
</label>


<div class="smart-select">


<input 
id="divisionSearch"
placeholder="Search Division">


<div 
id="divisionList"
class="dropdown-list">
</div>


</div>


</div>






<div class="field">

<label>
District
</label>


<div class="smart-select">


<input 
id="districtSearch"
placeholder="Search District">


<div 
id="districtList"
class="dropdown-list">
</div>


</div>


</div>







<div class="field">

<label>
Thana / Upazila
</label>


<div class="smart-select">


<input 
id="thanaSearch"
placeholder="Search Thana">


<div 
id="thanaList"
class="dropdown-list">
</div>


</div>


</div>







<div class="field">

<label>
Union
</label>


<div class="smart-select">


<input 
id="unionSearch"
placeholder="Search Union">


<div 
id="unionList"
class="dropdown-list">
</div>


</div>


</div>







<div class="field">

<label>
Ward
</label>


<div class="smart-select">


<input 
id="wardSearch"
placeholder="Search Ward">


<div 
id="wardList"
class="dropdown-list">
</div>


</div>


</div>







<div class="field">


<label>
Village / Area
</label>


<input 
type="text"
placeholder="Enter village name">


</div>







<div class="field">


<label>
House / Road / Landmark
</label>


<textarea
placeholder="Enter full address"></textarea>


</div>



</div>


</div>







<!-- Permanent Address -->


<div class="form-card">


<h2>
🏠 Permanent Address
</h2>


<label class="check">


<input 
type="checkbox"
id="sameAddress">


Same as Present Address


</label>



<textarea
placeholder="Enter permanent address"></textarea>


</div>







<div class="submit-area">


<button type="button">

💾 Save Student

</button>


</div>






</div>





<script src="add-student.js"></script>

<script src="custom-dropdown.js"></script>



</body>

</html>
