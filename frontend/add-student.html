<!-- ==========================================
     Modern Date of Birth Picker
========================================== -->

<style>

.dob-picker {

    display: grid;

    grid-template-columns:
        0.8fr
        1.25fr
        1fr;

    gap: 8px;

    width: 100%;

}


.dob-picker select,
.dob-picker input {

    width: 100%;

    min-width: 0;

    height: 48px;

    padding: 0 12px;

    background: #ffffff;

    border: 1px solid #d9dee3;

    border-radius: 12px;

    outline: none;

    color: #333;

    font-size: 14px;

}


.dob-picker select:focus,
.dob-picker input:focus {

    border-color: #087f3d;

    box-shadow:
        0 0 0 3px
        rgba(8, 127, 61, 0.10);

}


.dob-picker input[type="number"] {

    appearance: textfield;

    -moz-appearance: textfield;

}


.dob-picker input[type="number"]::-webkit-inner-spin-button,
.dob-picker input[type="number"]::-webkit-outer-spin-button {

    -webkit-appearance: none;

    margin: 0;

}


.dob-help {

    display: block;

    margin-top: 6px;

    color: #7a7f85;

    font-size: 11px;

}


@media (max-width: 430px) {

    .dob-picker {

        grid-template-columns:
            0.75fr
            1.2fr
            1fr;

        gap: 6px;

    }


    .dob-picker select,
    .dob-picker input {

        height: 46px;

        padding: 0 8px;

        font-size: 13px;

    }

}

</style>

</head>

<!-- ==========================================
     Modern DOB Controller
========================================== -->

<script>

(function () {

    "use strict";


    const day =
        document.getElementById(
            "dobDay"
        );


    const month =
        document.getElementById(
            "dobMonth"
        );


    const year =
        document.getElementById(
            "dobYear"
        );


    const hiddenDate =
        document.getElementById(
            "dateOfBirth"
        );


    if (
        !day ||
        !month ||
        !year ||
        !hiddenDate
    ) {

        return;

    }


    const currentYear =
        new Date()
            .getFullYear();


    year.max =
        String(
            currentYear
        );


    /*
     * Generate the correct number
     * of days for the selected
     * month and year.
     */

    function loadDays() {

        const selectedDay =
            day.value;


        const monthNumber =
            Number(
                month.value
            );


        const yearNumber =
            Number(
                year.value
            );


        let maxDays = 31;


        if (monthNumber) {

            const safeYear =
                yearNumber
                ||
                2000;


            maxDays =
                new Date(
                    safeYear,
                    monthNumber,
                    0
                )
                .getDate();

        }


        day.innerHTML =
            '<option value="">Day</option>';


        for (
            let number = 1;
            number <= maxDays;
            number++
        ) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                String(number)
                    .padStart(
                        2,
                        "0"
                    );


            option.textContent =
                String(
                    number
                );


            day.appendChild(
                option
            );

        }


        if (
            Number(selectedDay)
            <=
            maxDays
        ) {

            day.value =
                selectedDay;

        }

    }


    /*
     * Convert:
     *
     * Day + Month + Year
     *
     * into:
     *
     * YYYY-MM-DD
     */

    function syncDateOfBirth() {

        const dayValue =
            day.value;


        const monthValue =
            month.value;


        const yearValue =
            year.value.trim();


        if (
            !dayValue ||
            !monthValue ||
            !yearValue
        ) {

            hiddenDate.value =
                "";

            return;

        }


        const numericYear =
            Number(
                yearValue
            );


        if (
            !Number.isInteger(
                numericYear
            )
            ||
            numericYear < 1900
            ||
            numericYear > currentYear
        ) {

            hiddenDate.value =
                "";

            return;

        }


        hiddenDate.value =

            String(
                numericYear
            )

            +

            "-"

            +

            monthValue

            +

            "-"

            +

            dayValue;

    }


    month.addEventListener(
        "change",
        function () {

            loadDays();

            syncDateOfBirth();

        }
    );


    year.addEventListener(
        "input",
        function () {

            loadDays();

            syncDateOfBirth();

        }
    );


    day.addEventListener(
        "change",
        syncDateOfBirth
    );


    loadDays();


})();

</script>
