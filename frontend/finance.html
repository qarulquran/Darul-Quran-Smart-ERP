<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Finance Management - Darul Quran ERP
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>



<div class="main">



<header class="topbar">


<h1>
Finance Management
</h1>


<div class="admin-profile">
Admin 👤
</div>


</header>







<div class="form-card">


<h2>
💰 Transaction Entry
</h2>






<div class="form-grid">





<div class="field">


<label>
Transaction Type
</label>


<select id="transactionType">


<option value="Income">
Income (আয়)
</option>


<option value="Expense">
Expense (ব্যয়)
</option>


</select>


</div>







<div class="field">


<label>
Category
</label>


<select id="category">


<option>
Select Category
</option>



</select>


</div>








<div class="field">


<label>
Amount
</label>


<input

type="number"

id="amount"

placeholder="Enter Amount">


</div>








<div class="field">


<label>
Date
</label>


<input

type="date"

id="date">


</div>







<div class="field">


<label>
Payment Method
</label>


<select id="method">


<option>
Cash
</option>


<option>
Bank
</option>


<option>
Bkash
</option>


</select>


</div>







<div class="field">


<label>
Received From / Paid To
</label>


<input

type="text"

id="person"

placeholder="Name">


</div>





</div>








<div class="field">


<label>
Note
</label>


<textarea

id="note"

placeholder="Transaction details"></textarea>


</div>








<button id="saveTransaction">


💾 Save Transaction

</button>






</div>










<div class="form-card">


<h2>
📊 Transaction History
</h2>


<table>


<thead>


<tr>

<th>
ID
</th>


<th>
Type
</th>


<th>
Category
</th>


<th>
Amount
</th>


<th>
Date
</th>


<th>
Method
</th>


</tr>


</thead>



<tbody id="transactionList">


</tbody>



</table>



</div>








</div>







<script src="finance.js"></script>



</body>


</html>
