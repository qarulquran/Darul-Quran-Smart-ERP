<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<title>Fee Due Report</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    background:#f5f5f5;
    font-family:Arial;
}

.container{

    width:95%;
    max-width:900px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:10px;

}


h2{
    text-align:center;
    color:#087f3d;
}


table{

width:100%;
border-collapse:collapse;
margin-top:20px;

}


th{

background:#087f3d;
color:white;
padding:10px;

}


td{

border:1px solid #ddd;
padding:10px;
text-align:center;

}


.total{

font-size:20px;
font-weight:bold;
color:red;
margin-top:20px;

}


select,input{

padding:10px;
width:100%;
margin-bottom:10px;

}


</style>

</head>


<body>


<div class="container">


<h2>
💰 Student Fee Due Report
</h2>


<label>
Select Fee Type
</label>


<select id="feeFilter"
onchange="loadDue()">

<option value="All">
All Fee
</option>

<option>
Monthly Fee
</option>

<option>
Admission Fee
</option>

<option>
Exam Fee
</option>

<option>
Book Fee
</option>

<option>
Uniform Fee
</option>

<option>
Tour Fee
</option>

<option>
Certificate Fee
</option>

<option>
Others
</option>


</select>




<table>


<thead>

<tr>

<th>
Student
</th>

<th>
Class
</th>

<th>
Fee Type
</th>

<th>
Paid
</th>

<th>
Due
</th>


</tr>


</thead>


<tbody id="dueTable">


</tbody>


</table>



<div class="total">

Total Due:
৳ <span id="totalDue">0</span>


</div>


</div>




<script src="fee-due.js"></script>


</body>

</html>
