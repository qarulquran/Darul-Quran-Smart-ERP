<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Money Receipt - Darul Quran ERP
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>



<div class="main">



<div class="receipt-box">



<h1>
দারুল কুরআন আহমদিয়া মাদ্রাসা
</h1>


<h2>
MONEY RECEIPT
</h2>



<hr>





<div class="receipt-info">


<p>

<b>
Receipt No:
</b>

<span id="receiptNo">
-
</span>

</p>



<p>

<b>
Date:
</b>

<span id="paymentDate">
-
</span>

</p>



</div>








<div class="student-info">


<h3>
Student Information
</h3>



<p>

<b>
Student Name:
</b>

<span id="studentName">
-
</span>

</p>




<p>

<b>
Student Code:
</b>

<span id="studentCode">
-
</span>

</p>




<p>

<b>
Class:
</b>

<span id="studentClass">
-
</span>

</p>



<p>

<b>
Father Name:
</b>

<span id="fatherName">
-
</span>

</p>




</div>








<div class="payment-info">


<h3>
Payment Information
</h3>




<p>

<b>
Fee Type:
</b>

<span id="feeType">
-
</span>

</p>




<p>

<b>
Month:
</b>

<span id="feeMonth">
-
</span>

</p>





<p>

<b>
Amount:
</b>

৳ <span id="amount">
0
</span>

</p>





<p>

<b>
Payment Method:
</b>

<span id="paymentMethod">
-
</span>

</p>



</div>










<h3>
Barcode
</h3>



<div id="barcode">

</div>







<br>


<button onclick="window.print()">

🖨 Print Receipt

</button>






<br><br>




<p>
জাযাকাল্লাহু খাইরান
</p>




</div>




</div>





<script src="receipt.js"></script>


</body>

</html>
