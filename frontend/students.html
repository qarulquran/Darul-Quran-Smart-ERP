<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Student Management - Darul Quran Smart ERP
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="main">


<header class="topbar">


<h1>
Student Management
</h1>


<div class="admin-profile">

Admin 👤

</div>


</header>




<div class="container">


<h2 class="page-title">
Students List
</h2>





<a href="add-student.html">

<button class="add-btn">
+ Add Student
</button>

</a>





<div class="search-box">


<input

type="text"

id="searchStudent"

placeholder="Search by Name / Code / Mobile"

autocomplete="off"

>


<button id="searchBtn">
Search
</button>


</div>





<div class="table-card">


<table>


<thead>

<tr>


<th>
Photo
</th>


<th>
Student Code
</th>


<th>
Name
</th>


<th>
Class
</th>


<th>
Father Name
</th>


<th>
Mobile
</th>


<th>
Fee Status
</th>


<th>
Action
</th>


</tr>

</thead>



<tbody id="studentTable">

</tbody>


</table>


</div>


</div>


</div>





<!-- ==========================================
     Core Configuration
========================================== -->


<script src="../config/app-config.js"></script>

<script src="../config/language-config.js"></script>

<script src="../config/permission-config.js"></script>



<!-- ==========================================
     Core Architecture
========================================== -->


<script src="../core/institute.js"></script>

<script src="../core/session.js"></script>

<script src="../core/auth.js"></script>

<script src="../core/database-manager.js"></script>

<script src="../core/bootstrap.js"></script>



<!-- ==========================================
     Existing System
========================================== -->


<script src="script.js"></script>

<script src="students.js"></script>


</body>

</html>
