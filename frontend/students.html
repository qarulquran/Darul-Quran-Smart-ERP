<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Management - Darul Quran ERP</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="main">


<header class="topbar">

<h1>Student Management</h1>

<div class="admin-profile">
Admin 👤
</div>

</header>




<div class="student-header">

<h2>Students List</h2>


<a href="add-student.html">

<button>
+ Add Student
</button>

</a>


</div>




<div class="search-box">

<input 
id="searchInput"
type="text"
placeholder="Search Student">


<button onclick="searchStudent()">
Search
</button>


</div>





<div class="table-box">


<table>


<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th>Class</th>

<th>Father Name</th>

<th>Mobile</th>

<th>Status</th>

<th>Action</th>


</tr>

</thead>



<tbody id="studentTableBody">


</tbody>



</table>


</div>



</div>





<script src="students.js"></script>


</body>

</html>
