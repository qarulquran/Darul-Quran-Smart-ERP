<!DOCTYPE html>

<html lang="bn" dir="ltr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
ISM - Islamic School Management
</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


:root {

    --primary: #087f3d;
    --primary-dark: #05642f;
    --soft: #eaf7ef;

    --text: #1f2937;
    --muted: #6b7280;

    --border: #e5e7eb;

    --white: #ffffff;

}


body {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        linear-gradient(
            135deg,
            #f4faf6,
            #eef5f1
        );

    font-family:
        Arial,
        "Noto Sans Bengali",
        "Noto Sans Arabic",
        sans-serif;

}


.login-wrapper {

    width: 100%;

    max-width: 430px;

}


.login-card {

    background: var(--white);

    border: 1px solid var(--border);

    border-radius: 24px;

    padding: 34px;

    box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.09);

}


.brand {

    text-align: center;

    margin-bottom: 28px;

}


.brand-logo {

    width: 76px;

    height: 76px;

    margin: 0 auto 15px;

    object-fit: contain;

}


.brand h1 {

    color: var(--primary);

    font-size: 30px;

    margin-bottom: 5px;

}


.brand h2 {

    color: var(--text);

    font-size: 17px;

    font-weight: 600;

    margin-bottom: 6px;

}


.brand p {

    color: var(--muted);

    font-size: 13px;

}


.institution-box {

    background: var(--soft);

    border: 1px solid #ccebd8;

    border-radius: 14px;

    padding: 13px 15px;

    margin-bottom: 22px;

    text-align: center;

}


.institution-box small {

    display: block;

    color: var(--muted);

    margin-bottom: 4px;

}


.institution-box strong {

    color: var(--primary);

    font-size: 15px;

}


.language-row {

    display: flex;

    justify-content: flex-end;

    margin-bottom: 16px;

}


.language-row select {

    border: 1px solid var(--border);

    border-radius: 9px;

    padding: 8px 10px;

    background: white;

}


.form-group {

    margin-bottom: 16px;

}


.form-group label {

    display: block;

    margin-bottom: 7px;

    color: var(--text);

    font-size: 14px;

    font-weight: 600;

}


.form-group input {

    width: 100%;

    padding: 13px 14px;

    border: 1px solid var(--border);

    border-radius: 11px;

    font-size: 15px;

    outline: none;

    transition: 0.2s;

}


.form-group input:focus {

    border-color: var(--primary);

    box-shadow:
        0 0 0 3px
        rgba(8, 127, 61, 0.10);

}


.password-wrapper {

    position: relative;

}


.password-wrapper input {

    padding-right: 50px;

}


.password-toggle {

    position: absolute;

    right: 10px;

    top: 50%;

    transform: translateY(-50%);

    border: none;

    background: transparent;

    cursor: pointer;

    font-size: 18px;

}


.login-button {

    width: 100%;

    border: none;

    border-radius: 11px;

    padding: 14px;

    background: var(--primary);

    color: white;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

    margin-top: 5px;

    transition: 0.2s;

}


.login-button:hover {

    background: var(--primary-dark);

}


.login-button:disabled {

    opacity: 0.7;

    cursor: wait;

}


.error-message {

    display: none;

    margin-top: 14px;

    padding: 11px 13px;

    border-radius: 10px;

    background: #fff0f0;

    color: #b42318;

    border: 1px solid #f4c7c7;

    font-size: 13px;

}


.demo-note {

    margin-top: 20px;

    padding-top: 18px;

    border-top: 1px solid var(--border);

    text-align: center;

    color: var(--muted);

    font-size: 11px;

    line-height: 1.6;

}


.footer {

    text-align: center;

    margin-top: 18px;

    color: var(--muted);

    font-size: 11px;

}


[dir="rtl"] {

    direction: rtl;

}


[dir="rtl"] .password-wrapper input {

    padding-right: 14px;

    padding-left: 50px;

}


[dir="rtl"] .password-toggle {

    right: auto;

    left: 10px;

}


@media (max-width: 480px) {

    .login-card {

        padding: 25px 20px;

        border-radius: 20px;

    }


    .brand h1 {

        font-size: 27px;

    }

}

</style>

</head>


<body>


<div class="login-wrapper">


<div class="login-card">


<!-- ======================================
     Platform Branding
====================================== -->


<div class="brand">


<img
id="platformLogo"
class="brand-logo"
src="../assets/images/ism-icon.png"
alt="ISM">


<h1>
ISM
</h1>


<h2>
Islamic School Management
</h2>


<p>
Smart Management for Islamic Education
</p>


</div>



<!-- ======================================
     Institution
====================================== -->


<div class="institution-box">


<small>
Institution
</small>


<strong id="institutionName">
Darul Quran Ahmadia Madrasah
</strong>


</div>



<!-- ======================================
     Language
====================================== -->


<div class="language-row">


<select
id="languageSelector"
aria-label="Language">


<option value="bn">
বাংলা
</option>


<option value="en">
English
</option>


<option value="ar">
العربية
</option>


</select>


</div>



<!-- ======================================
     Login Form
====================================== -->


<form id="loginForm">


<div class="form-group">


<label for="username">
Username
</label>


<input
type="text"
id="username"
autocomplete="username"
required>


</div>



<div class="form-group">


<label for="password">
Password
</label>


<div class="password-wrapper">


<input
type="password"
id="password"
autocomplete="current-password"
required>


<button
type="button"
class="password-toggle"
id="passwordToggle"
aria-label="Show or hide password">

👁

</button>


</div>


</div>



<button
type="submit"
class="login-button"
id="loginButton">

Login

</button>


</form>



<div
id="errorMessage"
class="error-message">

Invalid Username or Password

</div>



<div class="demo-note">

Development environment only.<br>
Production authentication will use secure server-side authentication.

</div>


</div>



<div class="footer">

ISM · Islamic School Management

</div>


</div>



<!-- ======================================
     Core Configuration
====================================== -->


<script src="../config/app-config.js"></script>

<script src="../config/language-config.js"></script>

<script src="../config/permission-config.js"></script>



<!-- ======================================
     ISM Core System
====================================== -->


<script src="../core/institute.js"></script>

<script src="../core/session.js"></script>

<script src="../core/auth.js"></script>

<script src="../core/database-manager.js"></script>

<script src="../core/clearance-manager.js"></script>

<script src="../core/bootstrap.js"></script>



<!-- ======================================
     Login Page Controller
====================================== -->


<script>

(function () {

    "use strict";


    // ==================================
    // Institution
    // ==================================

    if (
        typeof window.getInstitution ===
        "function"
    ) {

        const institution =
            window.getInstitution();


        const element =
            document.getElementById(
                "institutionName"
            );


        if (
            element &&
            institution
        ) {

            element.textContent =
                institution.name;

        }

    }



    // ==================================
    // Language
    // ==================================

    const languageSelector =
        document.getElementById(
            "languageSelector"
        );


    function applyDirection(language) {

        document.documentElement.lang =
            language;


        document.documentElement.dir =
            language === "ar"
                ? "rtl"
                : "ltr";

    }


    const savedLanguage =
        localStorage.getItem(
            "erp_language"
        )
        ||
        "bn";


    languageSelector.value =
        savedLanguage;


    applyDirection(
        savedLanguage
    );


    languageSelector.addEventListener(
        "change",
        function () {

            const language =
                languageSelector.value;


            localStorage.setItem(
                "erp_language",
                language
            );


            applyDirection(
                language
            );

        }
    );



    // ==================================
    // Password Toggle
    // ==================================

    const password =
        document.getElementById(
            "password"
        );


    const toggle =
        document.getElementById(
            "passwordToggle"
        );


    toggle.addEventListener(
        "click",
        function () {

            if (
                password.type ===
                "password"
            ) {

                password.type =
                    "text";

                toggle.textContent =
                    "🙈";

            }

            else {

                password.type =
                    "password";

                toggle.textContent =
                    "👁";

            }

        }
    );



    // ==================================
    // Login
    // ==================================

    const form =
        document.getElementById(
            "loginForm"
        );


    const button =
        document.getElementById(
            "loginButton"
        );


    const errorBox =
        document.getElementById(
            "errorMessage"
        );


    form.addEventListener(
        "submit",
        function (event) {

            event.preventDefault();


            const username =
                document.getElementById(
                    "username"
                )
                .value
                .trim();


            const passwordValue =
                password.value;


            errorBox.style.display =
                "none";


            button.disabled =
                true;


            const result =
                typeof window.login ===
                "function"

                    ?

                    window.login(
                        username,
                        passwordValue
                    )

                    :

                    {
                        success: false,
                        message:
                            "Authentication system unavailable."
                    };


            if (
                result &&
                result.success
            ) {


                // --------------------------------
                // Sync Institution
                // --------------------------------

                if (
                    result.session &&
                    typeof window.getInstitution ===
                    "function" &&
                    typeof window.setInstitution ===
                    "function"
                ) {

                    const institution =
                        window.getInstitution();


                    if (
                        institution &&
                        institution.id ===
                        result.session.institutionId
                    ) {

                        localStorage.setItem(
                            "ISM_INSTITUTION",
                            JSON.stringify(
                                institution
                            )
                        );

                    }

                }


                window.location.href =
                    "dashboard.html";


                return;

            }


            errorBox.textContent =
                (
                    result &&
                    result.message
                )
                ||
                "Invalid Username or Password";


            errorBox.style.display =
                "block";


            button.disabled =
                false;

        }
    );


})();

</script>


</body>

</html>
