<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Student - Darul Quran ERP</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="main">


<header class="topbar">

<h1>Edit Student</h1>

<div class="admin-profile">
Admin 👤
</div>

</header>



<div class="form-box">


<h2>Update Student Information</h2>


<form>


<div class="form-grid">


<div>
<label>Student Name</label>
<input type="text" value="Ahmed Rahman">
</div>


<div>
<label>Father Name</label>
<input type="text" value="Md. Rahman">
</div>


<div>
<label>Mother Name</label>
<input type="text" value="Fatema Begum">
</div>


<div>
<label>Date of Birth</label>
<input type="date">
</div>


<div>

<label>Class</label>

<select>

<option>Class 5</option>
<option>Class 6</option>
<option>Class 7</option>

</select>

</div>



<div>
<label>Mobile Number</label>
<input type="number" value="017XXXXXXXX">
</div>


</div>



<div>

<label>Address</label>

<textarea>
Dhaka, Bangladesh
</textarea>

</div>



<button type="submit">
Update Student
</button>


</form>


</div>


</div>


</body>

</html>
