<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Student Marksheet - Darul Quran ERP
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<div class="main">



<div class="marksheet">



<h1>
দারুল কুরআন আহমদিয়া মাদ্রাসা
</h1>


<h2>
Academic Marksheet
</h2>



<hr>







<div class="student-header">



<img

id="studentPhoto"

src="https://via.placeholder.com/120"

width="120">





<div>


<p>

<b>
Student Name:
</b>

<span id="studentName">
-
</span>

</p>




<p>

<b>
Student Code:
</b>

<span id="studentCode">
-
</span>

</p>




<p>

<b>
Class:
</b>

<span id="studentClass">
-
</span>

</p>




<p>

<b>
Exam:
</b>

<span id="examName">
-
</span>

</p>



</div>




</div>









<table>


<thead>


<tr>


<th>
Subject
</th>


<th>
Mark
</th>


<th>
Grade
</th>



</tr>


</thead>




<tbody id="subjectList">



</tbody>




</table>









<div class="result-summary">


<h3>

Total Mark:

<span id="totalMark">
0
</span>

</h3>




<h3>

Average:

<span id="average">
0
</span>

</h3>




<h3>

Grade:

<span id="grade">
-
</span>

</h3>




<h3>

GPA:

<span id="gpa">
0
</span>

</h3>



</div>








<div class="signature-area">


<div>

_________________

<br>

Class Teacher

</div>




<div>

_________________

<br>

Principal

</div>



</div>









<button onclick="window.print()">

🖨 Print Marksheet

</button>






</div>



</div>







<script src="marksheet.js"></script>



</body>

</html>
